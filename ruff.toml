# Select the rule set explicitly rather than inheriting ruff's defaults. The
# defaults expand between ruff releases, so inheriting them lets a new release
# turn CI red on an unchanged tree.
#
# This is the set the code was written against. Adding pyupgrade (UP) or isort
# (I) is worth doing, but as a deliberate change with the resulting diff, not as
# a side effect of a version bump.
[lint]
select = ["E4", "E7", "E9", "F"]
